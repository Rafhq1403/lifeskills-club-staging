<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- Looping swirl into an arrow — corner accent, like the PDF's top-right decoration -->
  <symbol id="doodle-swirl-arrow" viewBox="0 0 160 120" fill="none">
    <path d="M6 60c0-22 18-38 38-38s34 16 34 34-14 30-30 30-24-12-24-24 10-20 20-20 16 8 16 16"
      stroke="#1A1A1A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M92 46c22 4 44 16 58 34" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round"/>
    <path d="M128 70l24 12-4-26" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Small wavy underline squiggle (as seen under the pencil tip in the PDF) -->
  <symbol id="doodle-underline" viewBox="0 0 90 34" fill="none">
    <path d="M3 8c4 8 6 8 10 2s6-6 10 0 6 8 10 2 6-6 10 0 6 10 12 4 8-10 8-10"
      stroke="#4A90D9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Tilted pencil -->
  <symbol id="doodle-pencil" viewBox="0 0 100 220" fill="none">
    <path d="M40 8c6-6 14-6 20 0l14 14c6 6 6 14 0 20L34 82 16 64Z" fill="#C0562A" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M34 82L74 42l0 0" stroke="#1A1A1A" stroke-width="0"/>
    <rect x="15" y="55" width="34" height="150" rx="6" transform="rotate(45 32 60)" fill="#F5B942" stroke="#1A1A1A" stroke-width="5"/>
    <path d="M8 150l40 40-18 26-30-30Z" fill="#EFC9A0" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M8 150l16 36-16-6Z" fill="#1A1A1A"/>
  </symbol>

  <!-- Magnifying glass with sparkle -->
  <symbol id="doodle-magnifier" viewBox="0 0 140 150" fill="none">
    <circle cx="55" cy="55" r="38" fill="#4A90D9" stroke="#1A1A1A" stroke-width="6"/>
    <circle cx="55" cy="55" r="38" fill="none" stroke="#1A1A1A" stroke-width="6"/>
    <rect x="78" y="88" width="24" height="58" rx="8" fill="#F5B942" stroke="#1A1A1A" stroke-width="6" transform="rotate(38 90 100)"/>
    <path d="M112 96l16 16-8 22-16-16Z" fill="#1A1A1A"/>
    <g stroke="#C0562A" stroke-width="5" stroke-linecap="round">
      <path d="M118 34l8 8"/>
      <path d="M126 30v12"/>
    </g>
    <circle cx="122" cy="20" r="4" fill="#C0562A"/>
  </symbol>

  <!-- Decorative lightbulb (background accent, not the mascot's) -->
  <symbol id="doodle-lightbulb" viewBox="0 0 100 140" fill="none">
    <path d="M50 8c-20 0-34 14-34 33 0 13 7 21 13 28 5 6 7 10 7 17h28c0-7 2-11 7-17 6-7 13-15 13-28C84 22 70 8 50 8Z"
      fill="#FFF7E0" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M40 40c2-6 6-10 12-11" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
    <rect x="36" y="92" width="28" height="10" rx="3" fill="#9CA3AF" stroke="#1A1A1A" stroke-width="4"/>
    <rect x="38" y="104" width="24" height="9" rx="3" fill="#9CA3AF" stroke="#1A1A1A" stroke-width="4"/>
    <g stroke="#1A1A1A" stroke-width="5" stroke-linecap="round">
      <path d="M50 0v10"/>
      <path d="M14 20l8 8"/>
      <path d="M86 20l-8 8"/>
      <path d="M4 52h11"/>
      <path d="M85 52h11"/>
    </g>
  </symbol>

  <!-- Megaphone with lightning bolts -->
  <symbol id="doodle-megaphone" viewBox="0 0 160 140" fill="none">
    <path d="M100 20L46 46H24a10 10 0 0 0-10 10v14a10 10 0 0 0 10 10h22l54 26Z"
      fill="#4A90D9" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>
    <rect x="18" y="46" width="10" height="24" rx="3" fill="#E4E7EC" stroke="#1A1A1A" stroke-width="5"/>
    <path d="M46 78v18a10 10 0 0 0 10 10h4a10 10 0 0 0 10-9l2-14" fill="#fff" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"/>
    <g stroke="#F5B942" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M110 8l-10 16 10 2-8 18"/>
      <path d="M130 26l-9 14 9 2-7 16"/>
    </g>
  </symbol>

  <!-- Sparkle / star accent -->
  <symbol id="doodle-sparkle" viewBox="0 0 40 40" fill="none">
    <path d="M20 2c1 8 3 10 11 11-8 1-10 3-11 11-1-8-3-10-11-11 8-1 10-3 11-11Z" fill="#C0562A"/>
  </symbol>

  <!-- Loose scribble bracket (used near headings) -->
  <symbol id="doodle-scribble" viewBox="0 0 120 40" fill="none">
    <path d="M4 20c10-14 20-18 30-14s10 14 20 14 16-10 26-12 20 2 30 8"
      stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  </symbol>

</svg>
