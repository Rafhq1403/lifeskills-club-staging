<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حزمة الجلسة | Session pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<style>
  /* ────────────────────────────────────────────────────────────────
     The print pack: everything that leaves the screen. Students have
     no devices, so this is the paper path — the facilitator's
     run-sheet (insurance for the day the projector fails), reflection
     slips, activity sheets for pairs, the observation card, and the
     family message. One session, rendered from the same source as the
     cockpit and the projector. Printed in the current UI language.
     ──────────────────────────────────────────────────────────────── */
  body { background: var(--color-neutral-100); }
  .pp-toolbar { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border);
    padding: var(--space-3) var(--space-5); display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .pp-toolbar .grow { flex: 1; min-width: 12rem; }
  .pp-toolbar label { display: inline-flex; align-items: center; gap: .4em; font-size: .9rem; }
  .pp-toolbar input[type=number] { width: 4.5rem; }

  .sheet { background: #fff; width: 210mm; min-height: 297mm; margin: var(--space-6) auto; padding: 14mm 14mm 16mm;
    box-shadow: var(--shadow-md); position: relative; break-after: page; page-break-after: always; box-sizing: border-box; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  .sheet h1 { font-size: 1.5rem; line-height: 1.25; margin-bottom: 2mm; }
  .sheet h2 { font-size: 1.15rem; margin: 0 0 3mm; }
  .sheet-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6mm; border-bottom: 2px solid var(--color-ink); padding-bottom: 3mm; margin-bottom: 5mm; }
  .sheet-head .k { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
  .sheet-foot { position: absolute; bottom: 8mm; inset-inline: 14mm; display: flex; justify-content: space-between; font-size: .72rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 2mm; }

  /* run-sheet */
  .spine { display: flex; gap: 1mm; margin: 3mm 0 5mm; }
  .spine > div { flex: 1 1 0; text-align: center; font-size: .72rem; padding: 1.5mm 1mm; border: 1px solid var(--border); border-radius: 3px; background: var(--color-neutral-50); }
  .spine b { display: block; font-size: .8rem; }
  .rs-card { display: grid; grid-template-columns: 22mm 1fr; gap: 4mm; padding: 3mm 0; border-top: 1px solid var(--color-neutral-200); break-inside: avoid; }
  .rs-card .st { font-size: .78rem; }
  .rs-card .st b { display: block; font-size: .9rem; color: var(--color-primary-dark); }
  .rs-card .st .mm { font-family: var(--font-mono); color: var(--text-muted); }
  .rs-card .st .aud { display: inline-block; margin-top: 1mm; font-size: .68rem; padding: .5mm 1.5mm; border-radius: 3px; background: var(--color-neutral-100); }
  .rs-card .st .aud.f { background: var(--color-warning-50); color: var(--color-warning-dark); }
  .rs-card .st .aud.s { background: var(--color-success-50); color: var(--color-success-dark); }
  .rs-card h3 { font-size: 1rem; margin-bottom: 1.5mm; }
  .rs-card p { font-size: .84rem; line-height: 1.5; margin: 0 0 1.5mm; white-space: pre-wrap; }
  .rs-card .lbl { font-weight: 700; color: var(--color-neutral-600); }
  .rs-card .lbl.warn { color: var(--color-error); }
  .rs-card ul { padding-inline-start: 4mm; font-size: .84rem; margin: 0 0 1.5mm; }

  /* slips: 2 × 2 per A4 with cut marks */
  .slips { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0; height: 262mm; }
  .slip { border: 1px dashed var(--color-neutral-300); padding: 6mm; display: flex; flex-direction: column; }
  .slip .k { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
  .slip h3 { font-size: 1.05rem; margin: 1.5mm 0 1mm; }
  .slip .lead { font-size: .85rem; color: var(--text-muted); margin-bottom: 2mm; }
  .slip .q { font-size: .9rem; font-weight: 700; margin-top: 2mm; display: flex; gap: 1.5mm; }
  .slip .q .n { flex: none; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--color-primary); color: #fff; font-size: .7rem; display: grid; place-items: center; }
  .slip .lines { flex: 1; min-height: 14mm; background: repeating-linear-gradient(to bottom, transparent 0 7.5mm, var(--color-neutral-300) 7.5mm 7.7mm); margin-top: 1mm; }
  .slip .name { font-size: .75rem; color: var(--text-muted); margin-top: 2mm; }

  /* activity sheet */
  .act .cm-lead, .act .cm-statement { font-size: 1.15rem; margin-bottom: 4mm; white-space: pre-wrap; }
  .act .cm-rounds { display: grid; gap: 3mm; margin-bottom: 5mm; }
  .act .cm-round { display: grid; grid-template-columns: 22mm 1fr; gap: 3mm; padding: 3mm; border: 1.5px solid var(--color-neutral-300); border-radius: 4px; font-size: 1rem; }
  .act .cm-round .t { font-weight: 800; color: var(--color-primary-dark); }
  .act .cm-round .x b { margin-inline-end: .4em; }
  .act .cm-opts { display: flex; flex-wrap: wrap; gap: 2mm; margin-bottom: 4mm; }
  .act .cm-opt { border: 1.5px solid var(--color-primary-light); border-radius: 999px; padding: 1.5mm 4mm; font-weight: 700; }
  .act .cm-rule { border: 2px solid var(--color-warning); border-radius: 6px; padding: 4mm; margin-bottom: 4mm; background: var(--color-warning-50); }
  .act .cm-rule .k { font-size: .75rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--color-warning-dark); }
  .act .cm-rule .v { font-size: 1.15rem; font-weight: 700; line-height: 1.4; white-space: pre-wrap; }
  .act .cm-flow { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; margin-bottom: 4mm; }
  .act .cm-flow-item { border: 1.5px solid var(--color-neutral-300); border-radius: 4px; padding: 3mm; }
  .act .cm-flow-item .n { font-weight: 800; color: var(--color-primary); }
  .act .cm-flow-item .h { font-weight: 800; }
  .act .cm-flow-item .d { font-size: .9rem; color: var(--text-muted); }
  .act .cm-qs { display: grid; gap: 3mm; } .act .cm-q { display: flex; gap: 2mm; font-size: 1.05rem; }
  .act .cm-q .n { flex: none; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--color-primary); color: #fff; display: grid; place-items: center; font-size: .8rem; }
  .act .cm-hidden { display: block !important; }   /* paper reveals everything */
  .act .cm-reveal, .act .cm-checks, .act .cm-scale, .act .cm-next-up { display: none; }
  .act .cm-mission { border: 2px solid var(--color-primary); border-radius: 6px; padding: 4mm; }
  .act .cm-mission .k { font-size: .75rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--color-primary-dark); }
  .act .cm-mission .v { font-size: 1.15rem; font-weight: 700; white-space: pre-wrap; }

  /* observation card */
  .obs table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .obs th, .obs td { border: 1px solid var(--color-neutral-300); padding: 1.6mm 2mm; vertical-align: middle; }
  .obs th { background: var(--color-neutral-50); font-size: .72rem; }
  .obs td.nm { width: 38mm; font-weight: 600; }
  .obs td.lv { text-align: center; font-family: var(--font-mono); letter-spacing: .35em; color: var(--color-neutral-400); }
  .obs .legend { display: flex; gap: 4mm; flex-wrap: wrap; font-size: .8rem; margin: 3mm 0 4mm; }
  .obs .legend span b { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--color-primary); color: #fff; margin-inline-end: .4em; font-size: .75rem; }

  .fam p { font-size: 1.1rem; line-height: 1.7; white-space: pre-wrap; }

  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    .pp-toolbar, .no-print { display: none !important; }
    .sheet { margin: 0; box-shadow: none; width: auto; min-height: 0; height: 297mm; }
    .sheet.hidden { display: none !important; }
  }
</style>
</head>
<body>

<div class="pp-toolbar no-print">
  <div class="grow">
    <strong><span data-lang-only="ar">حزمة الجلسة</span><span data-lang-only="en">Session pack</span></strong>
    <span class="caption text-muted" id="ppMeta"></span>
  </div>
  <div class="lang-toggle"><button data-lang="ar">AR</button><button data-lang="en">EN</button></div>
  <label><input type="checkbox" id="secRun" checked> <span data-lang-only="ar">دليل التنفيذ</span><span data-lang-only="en">Run-sheet</span></label>
  <label><input type="checkbox" id="secSlips" checked> <span data-lang-only="ar">أوراق التأمل</span><span data-lang-only="en">Reflection slips</span></label>
  <label><input type="checkbox" id="secAct" checked> <span data-lang-only="ar">أوراق الأنشطة</span><span data-lang-only="en">Activity sheets</span></label>
  <label><input type="checkbox" id="secObs" checked> <span data-lang-only="ar">بطاقة الرصد</span><span data-lang-only="en">Observation card</span></label>
  <label><input type="checkbox" id="secFam" checked> <span data-lang-only="ar">رسالة الأسرة</span><span data-lang-only="en">Family message</span></label>
  <label><span data-lang-only="ar">عدد الطلاب</span><span data-lang-only="en">Students</span> <input type="number" id="ppStudents" class="input" min="1" max="40" value="14"></label>
  <button class="btn btn-primary btn-sm" id="ppPrint">🖨️ <span data-lang-only="ar">اطبع</span><span data-lang-only="en">Print</span></button>
</div>

<main id="pack"></main>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/cm-cards.js"></script>
<script src="js/session-fixtures.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const L = (a, e) => (getLang() === 'ar' ? a : e);
  const esc = CM.esc;
  const params = new URLSearchParams(location.search);
  let SESSION = null, roster = [];

  async function load() {
    const id = params.get('session');
    const fixtures = localStorage.getItem('dev_fixtures') === '1' || params.get('fixtures') === '1';
    if (id && !fixtures) {
      try {
        SESSION = CM.fromSession(await apiFetch(`/teacher/sessions/${id}`));
      } catch (err) {
        $('pack').innerHTML = `<div class="sheet"><p style="color:#c0392b">${esc(err.message)}</p></div>`;
        return;
      }
    } else {
      SESSION = JSON.parse(JSON.stringify((window.SESSION_FIXTURES && SESSION_FIXTURES[id]) || SESSION4_FIXTURE));
    }
    try {
      if (!fixtures) {
        const classes = await apiFetch('/teacher/classes');
        if (classes.length) roster = await apiFetch(`/teacher/classes/${classes[0].id}/roster`);
      }
    } catch (e) { /* no class — blank rows */ }
    render();
  }

  const stageName = (s) => { const st = CM.STAGES[s] || ['', '']; return L(st[0], st[1]); };
  const mins = (c) => c.dur ? Math.round(c.dur / 60) : null;
  const P = (c, k) => L(c[k + '_ar'], c[k + '_en']);
  const total = () => SESSION.cards.reduce((a, c) => a + (c.dur || 0), 0);
  const head = (kicker, title) => `<div class="sheet-head"><div><div class="k">${kicker}</div><h1>${title}</h1></div><div class="k">${esc(L(SESSION.title_ar, SESSION.title_en))}</div></div>`;
  const foot = (n) => `<div class="sheet-foot"><span>${esc(L(SESSION.skill_title_ar || '', SESSION.skill_title_en || ''))}</span><span>${L('نادي مهارات الحياة', 'Life Skills Club')} · ${n}</span></div>`;

  function runSheet() {
    const timed = SESSION.cards.filter((c) => c.dur);
    const spine = `<div class="spine">${timed.map((c) => `<div style="flex-grow:${c.dur}"><b>${esc(stageName(c.stage))}</b>${mins(c)} ${L('د', 'min')}</div>`).join('')}</div>`;
    const cards = SESSION.cards.map((c, n) => {
      const aud = c.aud === 'facilitator' ? `<span class="aud f">${L('للميسّر فقط', 'Facilitator only')}</span>` : c.aud === 'student_device' ? `<span class="aud s">${L('على أوراق الطلاب', 'On student slips')}</span>` : `<span class="aud">${L('على الشاشة', 'On the projector')}</span>`;
      const block = (lbl, txt, cls = '') => txt ? `<p><span class="lbl ${cls}">${lbl}:</span> ${esc(txt)}</p>` : '';
      const list = (lbl, arr) => arr && arr.length ? `<p class="lbl">${lbl}</p><ul>${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
      return `<div class="rs-card">
        <div class="st"><b>${esc(stageName(c.stage))}</b>${mins(c) ? `<span class="mm">${mins(c)} ${L('د', 'min')}</span>` : ''}<br>${aud}</div>
        <div>
          <h3>${n + 1}. ${esc(P(c, 't'))}</h3>
          ${c.statement_ar ? `<p><em>${esc(P(c, 'statement'))}</em></p>` : ''}
          ${block(L('ماذا تقول وتفعل', 'What you say and do'), P(c, 'i'))}
          ${list(L('أسئلة إثرائية', 'Follow-up prompts'), L(c.p_ar, c.p_en))}
          ${block(L('الأدوات', 'Materials'), P(c, 'm'))}
          ${block(L('الدعم والإثراء', 'Adaptation'), P(c, 'a'))}
          ${block(L('البديل الورقي', 'If the projector fails'), P(c, 'off'))}
          ${block(L('تنبيه حماية الطفل', 'Safeguarding'), P(c, 's'), 'warn')}
        </div></div>`;
    }).join('');
    return `<section class="sheet run" id="shRun">${head(L('دليل التنفيذ للميسّر', "Facilitator's run-sheet"), esc(L(SESSION.title_ar, SESSION.title_en)))}
      <p class="caption text-muted">${L(`${SESSION.cards.length} بطاقات · ${Math.round(total() / 60)} دقيقة · اقرأه قبل الجلسة بعشر دقائق، واحمله معك — هو خطتك إن تعطّلت الشاشة.`, `${SESSION.cards.length} cards · ${Math.round(total() / 60)} minutes · read it ten minutes before, carry it with you — it is your plan if the screen fails.`)}</p>
      ${spine}${cards}${foot(L('دليل التنفيذ', 'Run-sheet'))}</section>`;
  }

  function slips() {
    const cards = SESSION.cards.filter((c) => c.aud === 'student_device' && c.questions_ar);
    if (!cards.length) return '';
    const n = Math.max(1, +$('ppStudents').value || 14);
    const pages = Math.ceil(n / 4);
    return cards.map((c) => Array.from({ length: pages }, (_, p) =>
      `<section class="sheet slips-page" data-sec="slips"><div class="slips">${Array.from({ length: 4 }, () => `
        <div class="slip"><div class="k">${esc(L(SESSION.title_ar, SESSION.title_en))} · ${esc(stageName(c.stage))}</div>
          <h3>${esc(P(c, 't'))}</h3>${c.lead_ar ? `<div class="lead">${esc(P(c, 'lead'))}</div>` : ''}
          ${L(c.questions_ar, c.questions_en).map((q, i) => `<div class="q"><span class="n">${i + 1}</span><span>${esc(q)}</span></div><div class="lines"></div>`).join('')}
          <div class="name">${L('الاسم (اختياري)', 'Name (optional)')}: ____________________</div></div>`).join('')}</div>
        ${foot(`${L('ورقة التأمل', 'Reflection slip')} ${p + 1}/${pages}`)}</section>`).join('')).join('');
  }

  function activitySheets() {
    const cards = SESSION.cards.filter((c) => c.aud !== 'facilitator' && (c.rounds_ar || c.rule_ar || c.flow_ar || c.opts_ar || (c.questions_ar && c.type !== 'reflection') || c.mission_ar));
    return cards.map((c) => `<section class="sheet act" data-sec="act">${head(`${esc(stageName(c.stage))}${mins(c) ? ` · ${mins(c)} ${L('د', 'min')}` : ''}`, esc(P(c, 't')))}
      ${CM.stageBody(c, { lang: getLang(), revealed: 99, controls: false, next: { ar: SESSION.next_ar, en: SESSION.next_en } })}
      <p class="caption text-muted no-print">${L('انسخ ورقة لكل ثنائية أو مجموعة.', 'One copy per pair or group.')}</p>
      ${foot(L('ورقة نشاط', 'Activity sheet'))}</section>`).join('');
  }

  function observationCard() {
    const ev = SESSION.cards.find((c) => c.type === 'evidence' && c.checks_ar) || SESSION.cards.find((c) => c.checks_ar);
    if (!ev) return '';
    const checks = L(ev.checks_ar, ev.checks_en), scale = L(ev.scale_ar || ['1', '2', '3', '4'], ev.scale_en || ['1', '2', '3', '4']);
    const n = Math.max(roster.length, +$('ppStudents').value || 14);
    const rows = Array.from({ length: n }, (_, i) => `<tr><td class="nm">${roster[i] ? esc(roster[i].full_name) : '&nbsp;'}</td>${checks.map(() => '<td class="lv">1 2 3 4</td>').join('')}<td></td></tr>`).join('');
    return `<section class="sheet obs" data-sec="obs">${head(L('بطاقة الرصد', 'Observation card'), esc(P(ev, 't')))}
      <p class="caption">${esc(P(ev, 'lead'))} ${ev.i_ar ? '— ' + esc(P(ev, 'i')) : ''}</p>
      <div class="legend">${scale.map((s, i) => `<span><b>${i + 1}</b>${esc(s)}</span>`).join('')}</div>
      <table><thead><tr><th>${L('الطالب', 'Student')}</th>${checks.map((k) => `<th>${esc(k)}</th>`).join('')}<th>${L('ملاحظة', 'Note')}</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="caption text-muted" style="margin-top:3mm">${L('حلّق على مستوى واحد لكل سلوك ترصده. أدخل البطاقة في النظام بعد الجلسة.', 'Circle one level per behaviour you observe. Enter the card into the system after the session.')}</p>
      ${foot(L('بطاقة الرصد', 'Observation card'))}</section>`;
  }

  function familyMessage() {
    const c = SESSION.cards.find((x) => x.fam_ar || x.fam_en);
    if (!c) return '';
    return `<section class="sheet fam" data-sec="fam">${head(L('رسالة لولي الأمر', 'Message for families'), esc(L(SESSION.title_ar, SESSION.title_en)))}
      <p>${esc(P(c, 'fam'))}</p>
      ${c.mission_ar ? `<h2 style="margin-top:8mm">${L('مهمة الأسبوع', "This week's mission")}</h2><p>${esc(P(c, 'mission'))}</p>` : ''}
      ${foot(L('رسالة الأسرة', 'Family message'))}</section>`;
  }

  // applyLanguage() dispatches `langchange`, which we also listen to — so a
  // render must not re-enter itself through its own language pass.
  let rendering = false;
  function render() {
    if (!SESSION || rendering) return;
    rendering = true;
    try {
      $('ppMeta').textContent = ` — ${L(SESSION.title_ar, SESSION.title_en)} · ${SESSION.cards.length} ${L('بطاقات', 'cards')} · ${Math.round(total() / 60)} ${L('دقيقة', 'min')}`;
      $('pack').innerHTML = runSheet() + slips() + activitySheets() + observationCard() + familyMessage();
      applySections();
      applyLanguage(getLang());
      // Number the sheets once, after the language pass.
      [...document.querySelectorAll('.sheet')].forEach((s, i, all) => { const f = s.querySelector('.sheet-foot span:last-child'); if (f) f.textContent += ` · ${i + 1}/${all.length}`; });
    } finally {
      rendering = false;
    }
  }

  function applySections() {
    const on = { run: $('secRun').checked, slips: $('secSlips').checked, act: $('secAct').checked, obs: $('secObs').checked, fam: $('secFam').checked };
    const sec = (el) => el.id === 'shRun' ? 'run' : el.dataset.sec;
    document.querySelectorAll('.sheet').forEach((el) => el.classList.toggle('hidden', !on[sec(el)]));
  }

  ['secRun', 'secSlips', 'secAct', 'secObs', 'secFam'].forEach((id) => $(id).addEventListener('change', applySections));
  $('ppStudents').addEventListener('change', render);
  $('ppPrint').onclick = () => window.print();
  document.addEventListener('langchange', render);
  window.addEventListener('langchange', render);
  load();
</script>
</body>
</html>
