<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>نادي مهارات الحياة | الصفحة غير موجودة</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<style>
  /* Served by GitHub Pages for any missing path, so it must not assume a
     page-relative URL: links are root-relative to the site. */
  body{min-height:100vh;display:grid;place-items:center;background:var(--surface-alt)}
  .nf{max-width:30rem;text-align:center;padding:var(--space-8)}
  .nf .mark{width:64px;height:64px;margin:0 auto var(--space-5);display:block}
  .nf .ribbon{height:6px;border-radius:999px;margin:var(--space-5) auto;max-width:14rem;
    background:linear-gradient(90deg,var(--domain-self),var(--domain-manage),var(--domain-comm),var(--domain-rel),
      var(--domain-collab),var(--domain-think),var(--domain-decide),var(--domain-init))}
  .nf h1{font-size:1.6rem;letter-spacing:-.02em;margin:0}
  .nf p{color:var(--text-muted);margin:var(--space-3) 0 var(--space-6)}
  .nf .links{display:flex;gap:var(--space-3);justify-content:center;flex-wrap:wrap}
  .nf .lang{position:fixed;top:var(--space-4);inset-inline-start:var(--space-4)}
</style>
</head>
<body>
<div class="lang"><div class="lang-toggle"><button data-lang="ar">AR</button><button data-lang="en">EN</button></div></div>
<main class="nf">
  <img class="mark" src="favicon.svg" alt="">
  <h1><span data-lang-only="ar">هذه الصفحة غير موجودة</span><span data-lang-only="en">This page doesn’t exist</span></h1>
  <div class="ribbon" aria-hidden="true"></div>
  <p><span data-lang-only="ar">ربما تغيّر العنوان، أو كُتب الرابط خطأً. كل ما تحتاجه يبدأ من الصفحة الرئيسية.</span>
     <span data-lang-only="en">The address may have changed, or the link was mistyped. Everything you need starts from the home page.</span></p>
  <div class="links">
    <a href="index.html" class="btn btn-primary"><span data-lang-only="ar">الصفحة الرئيسية</span><span data-lang-only="en">Home</span></a>
    <a href="login.html" class="btn btn-secondary"><span data-lang-only="ar">تسجيل الدخول</span><span data-lang-only="en">Log in</span></a>
  </div>
</main>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>window.PAGE_TITLES={ar:'نادي مهارات الحياة | الصفحة غير موجودة',en:'Life Skills Club | Page not found'};</script>
