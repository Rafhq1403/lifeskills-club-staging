<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نادي مهارات الحياة | الجلسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  /* A student's view of one session: what they practised, the mission they
     carry out of it, and the note to take home. Deliberately NOT the
     facilitator's cards — this is the part a student owns. */
  .ss{max-width:44rem;margin-inline:auto}
  .ss-back{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;
    color:var(--text-muted);text-decoration:none;margin-bottom:var(--space-4)}
  .ss-back:hover{color:var(--u,var(--color-primary))}

  .ss-head{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);
    padding:var(--space-6) var(--space-7);position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
  .ss-head::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--u)}
  .ss-meta{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center;margin-bottom:var(--space-2)}
  .ss-pill{font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;
    color:var(--u);background:color-mix(in srgb,var(--u) 12%,transparent)}
  .ss-pill.plain{color:var(--text-muted);background:var(--surface-alt)}
  .ss-head h1{font-size:1.65rem;letter-spacing:-.02em;margin:.15rem 0 0}
  .ss-head .en{font-family:var(--font-en);color:var(--text-muted);font-size:.9rem;margin-top:.2rem}

  .ss-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:var(--space-5) var(--space-6);margin-top:var(--space-4);box-shadow:var(--shadow-sm)}
  .ss-card h2{font-size:1.05rem;margin:0 0 var(--space-1)}
  .ss-card .cap{font-family:var(--font-en);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-muted);margin-bottom:var(--space-4)}

  /* the mission — the thing they carry out of the room */
  .mission{background:color-mix(in srgb,var(--u) 7%,var(--surface));border-color:color-mix(in srgb,var(--u) 35%,var(--border))}
  .mission .body{font-size:1.05rem;line-height:1.85;white-space:pre-wrap}

  /* what you practised */
  .checks{list-style:none;padding:0;margin:0;display:grid;gap:var(--space-2)}
  .checks li{display:flex;gap:var(--space-3);align-items:flex-start;font-size:.95rem;line-height:1.6;
    background:var(--surface-warm);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4)}
  .checks li::before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
    font-size:.7rem;font-weight:700;background:color-mix(in srgb,var(--u) 16%,transparent);color:var(--u);margin-top:1px}

  .fam{background:var(--surface-warm)}
  .fam .body{font-size:.95rem;line-height:1.8;white-space:pre-wrap;color:var(--text)}

  .ss-empty{text-align:center;padding:var(--space-12);color:var(--text-muted)}
</style>
</head>
<body>

<nav class="topnav">
  <div class="container flex items-center justify-between">
    <a href="student-dashboard.html" class="brand"><span class="logo-mark">🌱</span>
      <span><span data-lang-only="ar">مهارات الحياة</span><span data-lang-only="en">Life Skills</span></span></a>
    <div class="nav-links">
      <a href="student-dashboard.html"><span data-lang-only="ar">الرئيسية</span><span data-lang-only="en">Home</span></a>
      <a href="student-path.html"><span data-lang-only="ar">رحلتي</span><span data-lang-only="en">My journey</span></a>
    </div>
    <div class="nav-actions"><div class="lang-toggle"><button data-lang="ar">AR</button><button data-lang="en">EN</button></div></div>
  </div>
</nav>

<div class="container ss" style="padding-block:var(--space-8);" data-main>
  <a class="ss-back" href="student-path.html">← <span data-lang-only="ar">رحلتي</span><span data-lang-only="en">My journey</span></a>
  <div id="body"><div class="ss-empty"><span data-lang-only="ar">جاري التحميل…</span><span data-lang-only="en">Loading…</span></div></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/dev-fixtures.js"></script>
<script>/* Phase C: gate this page on a real session + role. */ requireAuth(['student','teacher','admin']);</script>
<script src="js/cm-cards.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/session-fixtures.js"></script>
<script>
window.PAGE_TITLES={ar:'نادي مهارات الحياة | الجلسة',en:'Life Skills Club | Session'};
const L=(a,e)=>getLang()==='ar'?a:e;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SID=new URLSearchParams(location.search).get('session');
if(!SID) location.replace('student-path.html');
let SESSION=null;

/* A student reads their own session through /student/…; a facilitator or admin
   arriving from the library reads the same one through /teacher/…. Either way
   we fall back to the generated fixtures so it works with no backend. */
async function load(){
  const demo = localStorage.getItem('dev_fixtures')==='1';
  if(!demo){
    for(const p of [`/student/sessions/${SID}`, `/teacher/sessions/${SID}`]){
      try{ SESSION = CM.fromSession(await apiFetch(p)); break; }catch(e){}
    }
  }
  if(!SESSION && window.SESSION_FIXTURES && SESSION_FIXTURES[SID])
    SESSION = JSON.parse(JSON.stringify(SESSION_FIXTURES[SID]));
}

function unitOf(id){
  if(!window.CURRICULUM) return null;
  return CURRICULUM.units.find(u=>u.sessionIds.includes(id))||null;
}
function card(stage){ return (SESSION.cards||[]).find(c=>c.stage===stage)||null; }

function render(){
  if(!SESSION){
    $('body').innerHTML=`<div class="ss-empty">${L('لم نجد هذه الجلسة.','We could not find this session.')}
      <br><a href="student-path.html" class="text-primary">${L('عُد إلى رحلتك','Back to your journey')}</a></div>`;
    applyLanguage(getLang()); return;
  }
  const u=unitOf(SESSION.id), di=u&&u.domain_info;
  const col=di?di.color:'var(--color-primary)';
  const prep=card('prep'), mission=card('mission');
  const checks=prep?L(prep.checks_ar,prep.checks_en)||[]:[];
  const mText=mission?L(mission.mission_ar,mission.mission_en):'';
  const fText=mission?L(mission.fam_ar,mission.fam_en):'';

  $('body').style.setProperty('--u',col);
  $('body').innerHTML=`
    <div class="ss-head">
      <div class="ss-meta">
        <span class="ss-pill">${L('الجلسة','Session')} ${SESSION.order_index}</span>
        ${di?`<span class="ss-pill">${esc(L(di.ar,di.en))}</span>`:''}
        ${u?`<span class="ss-pill plain">${esc(L(u.name_ar,u.name_en))}</span>`:''}
      </div>
      <h1>${esc(L(SESSION.title_ar,SESSION.title_en))}</h1>
      <div class="en">${esc(L(SESSION.title_en,SESSION.title_ar))}</div>
    </div>

    ${checks.length?`<div class="ss-card">
      <h2>${L('ما تدرّبتَ عليه','What you practised')}</h2>
      <div class="cap">${L('','In this session')}</div>
      <ul class="checks">${checks.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
    </div>`:''}

    ${mText?`<div class="ss-card mission">
      <h2>${L('مهمّة الأسبوع','This week’s mission')}</h2>
      <div class="cap">${L('','Carry it out of the room')}</div>
      <div class="body">${esc(mText)}</div>
    </div>`:''}

    ${fText?`<div class="ss-card fam">
      <h2>${L('شارِك عائلتك','Share with your family')}</h2>
      <div class="cap">${L('','For home')}</div>
      <div class="body">${esc(fText)}</div>
    </div>`:''}
  `;
  applyLanguage(getLang());
}

document.addEventListener('langchange',()=>{ if(SESSION) render(); });
document.addEventListener('DOMContentLoaded',async()=>{ await load(); render(); });
</script>
</body>
</html>
