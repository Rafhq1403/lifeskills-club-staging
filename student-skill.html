<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>نادي مهارات الحياة | المهارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div style="display:flex; flex-direction:column; min-height:100vh;">
  <div style="height:var(--nav-height); border-bottom:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:space-between; padding-inline:var(--space-6); position:sticky; top:0; z-index:20;">
    <div class="flex items-center gap-3">
      <a href="student-dashboard.html#skills" id="back-to-skills-link" class="icon-btn" aria-label="back">←</a>
      <strong id="skill-title-topbar" style="display:block;">…</strong>
    </div>
    <div class="flex items-center gap-3">
      <span class="caption text-muted" id="skill-progress-text">—</span>
      <div class="lang-toggle"><button data-lang="ar">AR</button><button data-lang="en">EN</button></div>
      <div class="avatar" id="student-avatar">?</div>
    </div>
  </div>

  <div style="display:flex; flex:1; min-height:0;" class="wrap">
    <div style="flex:1; min-width:0; padding:var(--space-6); overflow-y:auto;" data-main>
      <div style="max-width:900px; margin-inline:auto;">
        <div id="viewer-content"></div>
        <div class="flex justify-between items-center mt-6">
          <button type="button" class="btn btn-secondary btn-sm" id="prev-block-btn">← <span data-lang-only="ar">السابق</span><span data-lang-only="en">Previous</span></button>
          <button type="button" class="btn btn-primary btn-sm" id="next-block-btn"><span data-lang-only="ar">التالي</span><span data-lang-only="en">Next</span> →</button>
        </div>
      </div>
    </div>

    <aside style="width:340px; flex-shrink:0; border-inline-start:1px solid var(--border); background:var(--surface); overflow-y:auto;">
      <div class="flex justify-between items-center" style="padding:var(--space-4); border-bottom:1px solid var(--border);">
        <strong><span data-lang-only="ar">محتوى المهارة</span><span data-lang-only="en">Skill content</span></strong>
        <span class="caption text-muted num" id="sidebar-progress-text">0/0</span>
      </div>
      <div id="skill-item-list"></div>
    </aside>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/dev-fixtures.js"></script>
<script>
  const skillId = new URLSearchParams(location.search).get('id');
  const BLOCK_ICONS = { article: '📄', video: '🎬', audio: '🎧', quiz: '❓', flashcards: '🃏', assignment: '📝' };

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  function videoEmbedHTML(url) {
    const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);
    if (ytMatch) {
      return `<iframe width="100%" src="https://www.youtube.com/embed/${ytMatch[1]}" frameborder="0" allowfullscreen style="aspect-ratio:16/9; border-radius:var(--radius-md); border:none; display:block;"></iframe>`;
    }
    return `<a href="${escapeAttr(url)}" target="_blank" class="btn btn-secondary">▶ <span data-lang-only="ar">مشاهدة الفيديو</span><span data-lang-only="en">Watch video</span></a>`;
  }

  // A "section" is either the skill's own loose (ungrouped) blocks (title: null,
  // rendered with no header — matches a skill with zero sessions exactly as
  // before) or one session's blocks (title: {ar, en}, rendered as a named
  // header, the way Udemy groups chapters under a section).
  let sections = [];
  let allBlocks = []; // sections' blocks flattened, in display order — drives prev/next and the active index
  let activeIndex = 0;

  // Time/effort gates — an active block gets exactly one of these running.
  // Cleared whenever a new block becomes active so leftover timers from a
  // previously-viewed block never fire against the wrong one.
  let activeTimerId = null;
  function clearActiveTimer() {
    if (activeTimerId) { clearInterval(activeTimerId); activeTimerId = null; }
  }

  function wordCount(text) {
    return (text || '').trim().split(/\s+/).filter(Boolean).length;
  }

  // Disables btn, counts down `totalSeconds`, then enables it and swaps in
  // readyLabelHTML. This is the shared mechanism behind the article
  // (estimated reading time) and video (declared/fallback length) gates —
  // both are "stay on this block for N seconds" checks, just sourced
  // differently. Not real engagement proof, but far stronger than a bare
  // click with zero requirement.
  function startCountdownGate(btn, totalSeconds, readyLabelHTML) {
    let remaining = Math.max(1, Math.ceil(totalSeconds));
    btn.disabled = true;
    const tick = () => {
      if (remaining <= 0) {
        clearActiveTimer();
        btn.disabled = false;
        btn.innerHTML = readyLabelHTML;
        applyLanguage(getLang());
        return;
      }
      btn.innerHTML = `<span data-lang-only="ar">... (${remaining} ث متبقية)</span><span data-lang-only="en">... (${remaining}s left)</span>`;
      applyLanguage(getLang());
      remaining -= 1;
    };
    tick();
    activeTimerId = setInterval(tick, 1000);
  }

  function renderViewerBlock(b) {
    clearActiveTimer();
    const container = document.getElementById('viewer-content');
    const titleHTML = `<h2 class="flex items-center gap-3"><span class="icon-chip primary">${BLOCK_ICONS[b.block_type]}</span><span><span data-lang-only="ar">${escapeHtml(b.title_ar)}</span><span data-lang-only="en">${escapeHtml(b.title_en)}</span></span></h2>`;
    const doneBadge = b.completed ? '<span class="badge badge-success mt-2">✓ <span data-lang-only="ar">تم</span><span data-lang-only="en">Done</span></span>' : '';

    if (b.block_type === 'article') {
      container.innerHTML = `
        ${titleHTML}
        <p class="mt-3"><span data-lang-only="ar">${escapeHtml(b.content.body_ar)}</span><span data-lang-only="en">${escapeHtml(b.content.body_en)}</span></p>
        <div class="mt-3">${b.completed ? doneBadge : `<button type="button" class="btn btn-secondary btn-sm mark-complete-btn" data-id="${b.id}"></button>`}</div>
      `;
      if (!b.completed) {
        const words = getLang() === 'ar' ? wordCount(b.content.body_ar) : wordCount(b.content.body_en);
        const readSeconds = Math.max(15, Math.ceil((words / 200) * 60)); // ~200 words/min
        startCountdownGate(
          container.querySelector('.mark-complete-btn'),
          readSeconds,
          '<span data-lang-only="ar">وضع علامة كمقروء</span><span data-lang-only="en">Mark as read</span>'
        );
      }
    } else if (b.block_type === 'video') {
      container.innerHTML = `
        ${titleHTML}
        <div class="mt-3">${videoEmbedHTML(b.content.url)}</div>
        <div class="mt-3">${b.completed ? doneBadge : `<button type="button" class="btn btn-secondary btn-sm mark-complete-btn" data-id="${b.id}"></button>`}</div>
      `;
      if (!b.completed) {
        // We only have an external iframe, not real playback events, so this
        // is "stayed on the block at least as long as its declared length" —
        // the admin-entered duration_seconds, or a flat fallback for videos
        // added before that field existed.
        const seconds = b.content.duration_seconds > 0 ? b.content.duration_seconds : 30;
        startCountdownGate(
          container.querySelector('.mark-complete-btn'),
          seconds,
          '<span data-lang-only="ar">وضع علامة كمشاهد</span><span data-lang-only="en">Mark as watched</span>'
        );
      }
    } else if (b.block_type === 'image') {
      container.innerHTML = `
        ${titleHTML}
        <img class="mt-3" src="${escapeAttr(b.content.url)}"
             alt="${escapeAttr(getLang() === 'ar' ? (b.content.alt_ar || '') : (b.content.alt_en || ''))}"
             style="max-width:100%;border-radius:var(--radius-md);border:1px solid var(--border);display:block;">
        <div class="caption text-muted mt-2">${escapeHtml(getLang() === 'ar' ? (b.content.alt_ar || '') : (b.content.alt_en || ''))}</div>
        <div class="mt-3">${b.completed ? doneBadge : `<button type="button" class="btn btn-secondary btn-sm mark-complete-btn" data-id="${b.id}"></button>`}</div>
      `;
    } else if (b.block_type === 'embed') {
      // Host is allow-listed server-side (see EMBED_ALLOWED_HOSTS); the offline
      // fallback is shown alongside so a failed iframe never dead-ends a lesson.
      container.innerHTML = `
        ${titleHTML}
        <iframe class="mt-3" src="${escapeAttr(b.content.url)}" loading="lazy"
                referrerpolicy="no-referrer" allowfullscreen
                sandbox="allow-scripts allow-same-origin allow-presentation"
                style="width:100%;aspect-ratio:16/9;border:1px solid var(--border);border-radius:var(--radius-md);display:block;"></iframe>
        ${b.content.fallback ? `<div class="caption text-muted mt-2">${escapeHtml(b.content.fallback)}</div>` : ''}
        <div class="mt-3">${b.completed ? doneBadge : `<button type="button" class="btn btn-secondary btn-sm mark-complete-btn" data-id="${b.id}"></button>`}</div>
      `;
    } else if (b.block_type === 'audio') {
      container.innerHTML = `
        ${titleHTML}
        <audio class="mt-3" controls style="width:100%;" id="audio-player-${b.id}" src="${escapeAttr(b.content.url)}"></audio>
        <div class="mt-3">${b.completed ? doneBadge : `<button type="button" class="btn btn-secondary btn-sm mark-complete-btn" data-id="${b.id}" disabled><span data-lang-only="ar">استمع للنهاية أولاً</span><span data-lang-only="en">Listen to the end first</span></button>`}</div>
      `;
      if (!b.completed) {
        // Real playback tracking, unlike video — it's a native <audio>
        // element we control, not an external embed, so we can require it
        // actually played through instead of just guessing at a duration.
        const audioEl = container.querySelector(`#audio-player-${b.id}`);
        const btn = container.querySelector('.mark-complete-btn');
        audioEl.addEventListener('ended', () => {
          btn.disabled = false;
          btn.innerHTML = '<span data-lang-only="ar">وضع علامة كمستمَع</span><span data-lang-only="en">Mark as listened</span>';
          applyLanguage(getLang());
        });
      }
    } else if (b.block_type === 'assignment') {
      const existing = b.completion_data ? b.completion_data.content : '';
      container.innerHTML = `
        ${titleHTML}
        <p class="mt-3"><span data-lang-only="ar">${escapeHtml(b.content.instructions_ar)}</span><span data-lang-only="en">${escapeHtml(b.content.instructions_en)}</span></p>
        <div class="field mt-3">
          <textarea class="input assignment-content-input" data-id="${b.id}" rows="4">${escapeHtml(existing)}</textarea>
        </div>
        <div class="flex items-center gap-2 mt-2">
          <button type="button" class="btn btn-primary btn-sm submit-assignment-btn" data-id="${b.id}"><span data-lang-only="ar">${b.completed ? 'إعادة التسليم' : 'تسليم'}</span><span data-lang-only="en">${b.completed ? 'Resubmit' : 'Submit'}</span></button>
          ${doneBadge}
        </div>
      `;
    } else if (b.block_type === 'quiz') {
      const questions = b.content.questions || [];
      if (b.completed) {
        const answers = b.completion_data.answers || [];
        const score = b.completion_data.score;
        const questionsHTML = questions.map((q, qi) => `
          <div class="mt-3">
            <strong><span data-lang-only="ar">${qi + 1}. ${escapeHtml(q.question_ar)}</span><span data-lang-only="en">${qi + 1}. ${escapeHtml(q.question_en)}</span></strong>
            <div class="mt-1">
              ${q.choices.map((c, ci) => {
                const isCorrect = ci === q.correct_index;
                const isPicked = ci === answers[qi];
                const marker = isCorrect ? '✓' : (isPicked ? '✗' : '·');
                return `<div class="caption ${isCorrect ? 'text-primary' : 'text-muted'}">${marker} <span data-lang-only="ar">${escapeHtml(c.text_ar)}</span><span data-lang-only="en">${escapeHtml(c.text_en)}</span>${isPicked && !isCorrect ? ' <span data-lang-only="ar">(اخترته)</span><span data-lang-only="en">(your answer)</span>' : ''}</div>`;
              }).join('')}
            </div>
          </div>
        `).join('');
        container.innerHTML = `
          ${titleHTML}
          <span class="badge badge-success mt-2"><span data-lang-only="ar">النتيجة</span><span data-lang-only="en">Score</span>: <span class="num">${score}%</span></span>
          ${questionsHTML}
        `;
      } else {
        const questionsHTML = questions.map((q, qi) => `
          <div class="mt-3">
            <strong><span data-lang-only="ar">${qi + 1}. ${escapeHtml(q.question_ar)}</span><span data-lang-only="en">${qi + 1}. ${escapeHtml(q.question_en)}</span></strong>
            <div class="mt-1">
              ${q.choices.map((c, ci) => `
                <label class="flex items-center gap-2 mt-1">
                  <input type="radio" name="quiz-${b.id}-${qi}" value="${ci}">
                  <span data-lang-only="ar">${escapeHtml(c.text_ar)}</span><span data-lang-only="en">${escapeHtml(c.text_en)}</span>
                </label>
              `).join('')}
            </div>
          </div>
        `).join('');
        container.innerHTML = `
          ${titleHTML}
          ${questionsHTML}
          <button type="button" class="btn btn-primary btn-sm mt-3 submit-quiz-btn" data-id="${b.id}"><span data-lang-only="ar">تسليم الإجابات</span><span data-lang-only="en">Submit answers</span></button>
        `;
      }
    } else if (b.block_type === 'flashcards') {
      const cardsData = b.content.cards || [];
      const cards = cardsData.map((c, ci) => `
        <div class="card card-hover flashcard" data-index="${ci}" style="cursor:pointer; text-align:center; min-height:120px; display:flex; flex-direction:column; justify-content:center;">
          <div class="caption text-muted flashcard-label"><span data-lang-only="ar">الوجه — اضغط للقلب</span><span data-lang-only="en">Front — click to flip</span></div>
          <div class="flashcard-front mt-2" style="font-weight:700;"><span data-lang-only="ar">${escapeHtml(c.front_ar)}</span><span data-lang-only="en">${escapeHtml(c.front_en)}</span></div>
          <div class="flashcard-back mt-2 hidden" style="font-weight:700;"><span data-lang-only="ar">${escapeHtml(c.back_ar)}</span><span data-lang-only="en">${escapeHtml(c.back_en)}</span></div>
        </div>
      `).join('');
      container.innerHTML = `
        ${titleHTML}
        <div class="grid grid-3 mt-3">${cards}</div>
        <p class="caption text-muted mt-3" id="flashcard-flip-progress"></p>
        <div class="mt-3">${b.completed ? doneBadge : `<button type="button" class="btn btn-secondary btn-sm mark-complete-btn" data-id="${b.id}" disabled><span data-lang-only="ar">اقلب كل البطاقات أولاً</span><span data-lang-only="en">Flip every card first</span></button>`}</div>
      `;
      if (!b.completed) {
        const flipped = new Set();
        const progressEl = container.querySelector('#flashcard-flip-progress');
        const btn = container.querySelector('.mark-complete-btn');
        const updateFlipProgress = () => {
          progressEl.innerHTML = `<span data-lang-only="ar">${flipped.size}/${cardsData.length} بطاقات تم قلبها</span><span data-lang-only="en">${flipped.size}/${cardsData.length} cards flipped</span>`;
          applyLanguage(getLang());
          if (flipped.size >= cardsData.length) {
            btn.disabled = false;
            btn.innerHTML = '<span data-lang-only="ar">وضع علامة كمُراجَع</span><span data-lang-only="en">Mark as reviewed</span>';
            applyLanguage(getLang());
          }
        };
        updateFlipProgress();
        container.querySelectorAll('.flashcard').forEach((card) => {
          card.addEventListener('click', () => {
            flipped.add(Number(card.dataset.index));
            updateFlipProgress();
          });
        });
      }
    }

    container.querySelectorAll('.flashcard').forEach((card) => {
      card.addEventListener('click', () => {
        card.querySelector('.flashcard-front').classList.toggle('hidden');
        card.querySelector('.flashcard-back').classList.toggle('hidden');
        const label = card.querySelector('.flashcard-label');
        const showingBack = !card.querySelector('.flashcard-back').classList.contains('hidden');
        label.innerHTML = showingBack
          ? '<span data-lang-only="ar">الظهر — اضغط للقلب</span><span data-lang-only="en">Back — click to flip</span>'
          : '<span data-lang-only="ar">الوجه — اضغط للقلب</span><span data-lang-only="en">Front — click to flip</span>';
        applyLanguage(getLang());
      });
    });
    container.querySelectorAll('.mark-complete-btn').forEach((btn) => {
      btn.addEventListener('click', () => completeBlock(btn.dataset.id, {}));
    });
    container.querySelectorAll('.submit-assignment-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const textarea = container.querySelector(`.assignment-content-input[data-id="${btn.dataset.id}"]`);
        const content = textarea.value.trim();
        if (!content) { alert(getLang() === 'ar' ? 'اكتب إجابتك أولاً.' : 'Write your answer first.'); return; }
        completeBlock(btn.dataset.id, { content });
      });
    });
    container.querySelectorAll('.submit-quiz-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const blockId = btn.dataset.id;
        const block = allBlocks[activeIndex];
        const answers = block.content.questions.map((q, qi) => {
          const checked = container.querySelector(`input[name="quiz-${blockId}-${qi}"]:checked`);
          return checked ? Number(checked.value) : -1;
        });
        if (answers.includes(-1)) { alert(getLang() === 'ar' ? 'أجب عن جميع الأسئلة أولاً.' : 'Answer every question first.'); return; }
        completeBlock(blockId, { answers });
      });
    });
    applyLanguage(getLang());
  }

  function renderSidebar() {
    const list = document.getElementById('skill-item-list');
    const done = allBlocks.filter((b) => b.completed).length;
    document.getElementById('sidebar-progress-text').textContent = `${done}/${allBlocks.length}`;
    document.getElementById('skill-progress-text').textContent = `${done}/${allBlocks.length}`;

    if (!allBlocks.length) {
      list.innerHTML = '<p class="text-muted" style="padding:var(--space-4);"><span data-lang-only="ar">لا توجد عناصر محتوى بعد.</span><span data-lang-only="en">No content blocks yet.</span></p>';
      applyLanguage(getLang());
      return;
    }

    let html = '';
    let globalIndex = 0;
    sections.forEach((section) => {
      if (section.title) {
        html += `
          <div class="caption" style="padding:var(--space-3) var(--space-4); background:var(--surface-alt); font-weight:700; border-bottom:1px solid var(--border);">
            <span data-lang-only="ar">${escapeHtml(section.title.ar)}</span><span data-lang-only="en">${escapeHtml(section.title.en)}</span>
          </div>
        `;
      }
      section.blocks.forEach((b) => {
        const i = globalIndex;
        const isActive = i === activeIndex;
        const statusDot = b.completed
          ? `<span style="width:20px; height:20px; border-radius:50%; background:var(--color-success); color:#fff; display:grid; place-items:center; font-size:0.7rem; flex-shrink:0;">✓</span>`
          : isActive
            ? `<span style="width:20px; height:20px; border-radius:50%; border:2px solid var(--color-primary); flex-shrink:0;"></span>`
            : `<span style="width:20px; height:20px; border-radius:50%; border:2px solid var(--border); flex-shrink:0;"></span>`;
        html += `
          <button type="button" class="skill-item-btn" data-index="${i}" style="display:flex; align-items:center; gap:var(--space-3); width:100%; text-align:start; padding:var(--space-3) var(--space-4); border:none; border-bottom:1px solid var(--border); background:${isActive ? 'var(--color-primary-50)' : 'transparent'}; cursor:pointer;">
            ${statusDot}
            <span class="icon-chip sm">${BLOCK_ICONS[b.block_type]}</span>
            <span style="flex:1; ${isActive ? 'font-weight:700; color:var(--color-primary-dark);' : ''}"><span data-lang-only="ar">${escapeHtml(b.title_ar)}</span><span data-lang-only="en">${escapeHtml(b.title_en)}</span></span>
          </button>
        `;
        globalIndex += 1;
      });
    });
    list.innerHTML = html;
    list.querySelectorAll('.skill-item-btn').forEach((btn) => {
      btn.addEventListener('click', () => goToIndex(Number(btn.dataset.index)));
    });
    applyLanguage(getLang());
  }

  function updateNavButtons() {
    document.getElementById('prev-block-btn').disabled = activeIndex <= 0;
    document.getElementById('next-block-btn').disabled = activeIndex >= allBlocks.length - 1;
  }

  function goToIndex(i) {
    if (i < 0 || i >= allBlocks.length) return;
    activeIndex = i;
    renderViewerBlock(allBlocks[activeIndex]);
    renderSidebar();
    updateNavButtons();
    window.scrollTo({ top: 0 });
  }

  document.getElementById('prev-block-btn').addEventListener('click', () => goToIndex(activeIndex - 1));
  document.getElementById('next-block-btn').addEventListener('click', () => goToIndex(activeIndex + 1));

  async function loadSkill() {
    const [skill, sessionList] = await Promise.all([
      apiFetch(`/student/skills/${skillId}`),
      apiFetch(`/student/skills/${skillId}/sessions`),
    ]);
    const sessionDetails = await Promise.all(
      sessionList.map((s) => apiFetch(`/student/sessions/${s.id}`))
    );

    document.getElementById('skill-title-topbar').innerHTML =
      `<span data-lang-only="ar">${escapeHtml(skill.title_ar)}</span><span data-lang-only="en">${escapeHtml(skill.title_en)}</span>`;

    // No sessions at all: the skill's loose blocks list flat, no header —
    // identical to a skill's content before sessions existed. Once sessions
    // exist, loose blocks (if any) get a generic header so every item in the
    // sidebar is still clearly grouped.
    // A student never sees the facilitator's own cards (the briefing and the
    // observation checklist are authored with audience 'facilitator'); the API
    // returns every block of a session, so the filter lives here.
    const forStudents = (blocks) => (blocks || []).filter((b) => b.audience !== 'facilitator');

    sections = [];
    if (forStudents(skill.blocks).length) {
      sections.push({
        title: sessionDetails.length ? { ar: 'محتوى عام', en: 'General' } : null,
        blocks: forStudents(skill.blocks),
      });
    }
    sessionDetails.forEach((sess) => {
      const blocks = forStudents(sess.blocks);
      if (blocks.length) sections.push({ title: { ar: sess.title_ar, en: sess.title_en }, blocks });
    });
    allBlocks = sections.flatMap((s) => s.blocks);

    if (activeIndex >= allBlocks.length) activeIndex = Math.max(0, allBlocks.length - 1);
    if (!allBlocks.length) {
      // Honest empty state: the self-paced lessons are being written (Khalifa's
      // track). "No content yet" read like a broken page; this reads like a plan.
      document.getElementById('viewer-content').innerHTML = `
        <div style="text-align:center;padding:var(--space-10) var(--space-6);max-width:32rem;margin-inline:auto">
          <div style="font-size:2rem;margin-bottom:var(--space-3)">📖</div>
          <h2 style="font-size:1.25rem;margin:0 0 var(--space-2)">
            <span data-lang-only="ar">الدروس الذاتية قيد الإعداد</span><span data-lang-only="en">Self-paced lessons are being prepared</span></h2>
          <p class="text-muted" style="margin:0 0 var(--space-5)">
            <span data-lang-only="ar">ستظهر هنا درساً لكل جلسة تحضرها في الصف، لتراجعه في وقتك أو تعوّض به جلسة فاتتك.</span>
            <span data-lang-only="en">A lesson for every classroom session will appear here — to review in your own time, or to catch up on a session you missed.</span></p>
          <a href="student-path.html" class="btn btn-secondary"><span data-lang-only="ar">العودة إلى رحلتي</span><span data-lang-only="en">Back to my journey</span></a>
        </div>`;
      applyLanguage(getLang());
    } else {
      renderViewerBlock(allBlocks[activeIndex]);
    }
    renderSidebar();
    updateNavButtons();
  }

  async function completeBlock(blockId, data) {
    try {
      await apiFetch(`/student/skills/blocks/${blockId}/complete`, { method: 'POST', body: JSON.stringify({ data }) });
      await loadSkill();
    } catch (err) {
      alert(err.message);
    }
  }

  (async () => {
    const me = await requireAuth('student');
    if (!me) return;
    document.getElementById('student-avatar').textContent = (me.full_name || me.email).trim().charAt(0);
    if (!skillId) {
      window.location.href = 'student-dashboard.html#skills';
      return;
    }
    try {
      await loadSkill();
    } catch (err) {
      document.getElementById('viewer-content').innerHTML =
        `<div class="card" style="border-color:#c0392b;"><p style="color:#c0392b;">${err.message}</p></div>`;
    }
  })();
</script>
</body>
</html>
